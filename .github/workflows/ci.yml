name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew test
      - name: Staging debug APK
        run: ./gradlew assembleStagingDebug
